name: Gradle APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle Project
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== ANDROID ==="
          ls -la android

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan!"
            exit 1
          fi

      - name: Give Gradlew Permission
        run: |
          chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "=== APK HASIL BUILD ==="
          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 3
