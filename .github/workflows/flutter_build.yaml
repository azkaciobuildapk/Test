name: Flutter / Gradle Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project"
        required: true
        type: string
      tag:
        description: "Tag unik build"
        required: true
        type: string
      build_type:
        description: "debug atau release"
        required: false
        default: "release"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validasi input
        run: |
          test -n "${{ inputs.zip_url }}" || { echo "::error::zip_url kosong"; exit 1; }
          test -n "${{ inputs.tag }}" || { echo "::error::tag kosong"; exit 1; }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Download ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: curl -L --fail --retry 3 -o project.zip "$ZIP_URL"

      - name: Extract ZIP
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q project.zip -d project

          # Naik satu level bila ZIP mempunyai satu folder pembungkus.
          for i in 1 2 3; do
            if [ -f project/pubspec.yaml ] || [ -f project/gradlew ] || [ -f project/android/gradlew ]; then
              break
            fi

            dirs=(project/*/)
            if [ "${#dirs[@]}" -eq 1 ]; then
              tmp=$(mktemp -d)
              cp -a "${dirs[0]}." "$tmp/"
              rm -rf project
              mv "$tmp" project
            else
              break
            fi
          done

      - name: Detect Flutter atau Gradle
        id: detect
        run: |
          set -e

          if [ -f project/pubspec.yaml ]; then
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "Flutter project detected."
          elif [ -f project/gradlew ]; then
            echo "type=gradle" >> "$GITHUB_OUTPUT"
            echo "Gradle project detected."
          elif [ -f project/android/gradlew ]; then
            echo "type=gradle-android" >> "$GITHUB_OUTPUT"
            echo "Android/Gradle project detected."
          else
            echo "::error::Tidak menemukan pubspec.yaml, gradlew, atau android/gradlew."
            exit 1
          fi

      # =========================
      # FLUTTER
      # =========================
      - name: Flutter pub get
        if: steps.detect.outputs.type == 'flutter'
        working-directory: project
        run: flutter pub get

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: project
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      # =========================
      # GRADLE / GENETIC
      # =========================
      - name: Prepare Gradle project
        if: steps.detect.outputs.type == 'gradle' || steps.detect.outputs.type == 'gradle-android'
        working-directory: project
        run: |
          set -e

          if [ -f android/gradlew ]; then
            cd android
          fi

          chmod +x gradlew

          echo "Gradle wrapper: $(pwd)/gradlew"
          echo "Mipmap tidak diwajibkan."
          echo "Project dengan mipmap maupun tanpa mipmap akan diproses."

      - name: Build Gradle APK
        if: steps.detect.outputs.type == 'gradle' || steps.detect.outputs.type == 'gradle-android'
        working-directory: project
        run: |
          set -e

          if [ -f android/gradlew ]; then
            cd android
          fi

          chmod +x gradlew

          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      # =========================
      # COLLECT APK
      # =========================
      - name: Collect APK
        if: always()
        run: |
          set -e
          rm -rf output
          mkdir -p output

          find project -type f -name "*.apk" -print -exec cp {} output/ \; || true

          if ! find output -type f -name "*.apk" | grep -q .; then
            echo "::warning::APK tidak ditemukan."
          else
            echo "APK:"
            find output -type f -name "*.apk" -print
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: output/*.apk
          if-no-files-found: warn
          retention-days: 1
