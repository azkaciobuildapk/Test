name: Genetic APK Build
on:
  workflow_dispatch:
    inputs:
      zip_url: { description: "Public ZIP URL", required: true, type: string }
      tag: { description: "Build tag", required: true, type: string }
      build_type:
        description: "debug or release"
        required: true
        default: release
        type: choice
        options: [debug, release]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Download Genetic project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 "$ZIP_URL" -o project.zip
          unzip -q project.zip -d project
          test -d project/android
          test -f project/android/settings.gradle || test -f project/android/settings.gradle.kts
          test -f project/android/build.gradle || test -f project/android/build.gradle.kts
      - name: Prepare Gradle
        working-directory: project/android
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then chmod +x gradlew; else gradle --version; fi
      - name: Build Genetic APK
        working-directory: project/android
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          GRADLE="./gradlew"
          [ -f gradlew ] || GRADLE="gradle"
          if [ "$BUILD_TYPE" = "debug" ]; then
            $GRADLE assembleDebug --no-daemon --stacktrace
          else
            $GRADLE assembleRelease --no-daemon --stacktrace
          fi
      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find project/android -type f -name "*.apk" -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: genetic-apk-${{ inputs.tag }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 1
