name: Pegasus.app Web to APK Build

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL website (http:// atau https://)"
        required: true
        type: string
      app_name:
        description: "Nama aplikasi"
        required: true
        type: string
      icon_url:
        description: "URL icon PNG (opsional)"
        required: false
        default: ""
        type: string
      tag:
        description: "Tag unik build"
        required: true
        type: string

env:
  WEB_URL: ${{ inputs.web_url }}
  APP_NAME: ${{ inputs.app_name }}
  ICON_URL: ${{ inputs.icon_url }}
  BUILD_TAG: ${{ inputs.tag }}

permissions:
  contents: read

concurrency:
  group: pegasus-app-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validasi input
        run: |
          set -euo pipefail
          [ -n "${WEB_URL:-}" ] || { echo "::error::web_url kosong"; exit 1; }
          case "$WEB_URL" in
            http://*|https://*) ;;
            *) echo "::error::URL harus diawali http:// atau https://"; exit 1 ;;
          esac
          [ -n "${APP_NAME:-}" ] || { echo "::error::app_name kosong"; exit 1; }
          [ -n "${BUILD_TAG:-}" ] || { echo "::error::tag kosong"; exit 1; }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Buat project Pegasus.app
        run: |
          set -euo pipefail
          flutter create \
            --org app.pegasus \
            --project-name pegasus_app \
            webapp

      - name: Tambah WebView
        working-directory: webapp
        run: flutter pub add webview_flutter

      - name: Tulis main.dart
        working-directory: webapp
        run: |
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const webUrl = String.fromEnvironment(
            'WEB_URL',
            defaultValue: 'https://example.com',
          );

          const appName = String.fromEnvironment(
            'APP_NAME',
            defaultValue: 'Pegasus.app',
          );

          void main() => runApp(const PegasusApp());

          class PegasusApp extends StatelessWidget {
            const PegasusApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: appName,
                debugShowCheckedModeBanner: false,
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});

            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController controller;
            bool loading = true;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (_) {
                      if (mounted) setState(() => loading = true);
                    },
                    onPageFinished: (_) {
                      if (mounted) setState(() => loading = false);
                    },
                  ),
                )
                ..loadRequest(Uri.parse(webUrl));
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) async {
                  if (didPop) return;
                  if (await controller.canGoBack()) {
                    await controller.goBack();
                  } else if (context.mounted) {
                    Navigator.of(context).pop();
                  }
                },
                child: Scaffold(
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: controller),
                        if (loading)
                          const Center(child: CircularProgressIndicator()),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART

      - name: Izinkan HTTP Cleartext + Internet
        working-directory: webapp
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys, re
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )

          if "android:usesCleartextTraffic=" not in text:
              text = re.sub(
                  r"(<application\\b)",
                  r'\1 android:usesCleartextTraffic="true"',
                  text,
                  count=1
              )
          else:
              text = re.sub(
                  r'android:usesCleartextTraffic="[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  text,
                  count=1
              )

          open(path, "w", encoding="utf-8").write(text)
          PY

      - name: Network Security Config untuk HTTP
        working-directory: webapp
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/xml

          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          XML

          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          text = open(path, encoding="utf-8").read()
          attr = 'android:networkSecurityConfig="@xml/network_security_config"'
          if "android:networkSecurityConfig=" not in text:
              text = re.sub(r"(<application\\b)", r'\1 ' + attr, text, count=1)
          else:
              text = re.sub(r'android:networkSecurityConfig="[^"]*"', attr, text, count=1)
          open(path, "w", encoding="utf-8").write(text)
          PY

      - name: Set nama aplikasi
        working-directory: webapp
        env:
          NAME: ${{ inputs.app_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from xml.sax.saxutils import escape
          path = "android/app/src/main/AndroidManifest.xml"
          name = escape(os.environ["NAME"])
          text = open(path, encoding="utf-8").read()
          text, count = re.subn(r'android:label="[^"]*"', f'android:label="{name}"', text, count=1)
          if count == 0:
              text = re.sub(r"(<application\\b)", rf'\1 android:label="{name}"', text, count=1)
          open(path, "w", encoding="utf-8").write(text)
          PY

      - name: Pasang icon opsional
        if: ${{ inputs.icon_url != '' }}
        working-directory: webapp
        env:
          ICON_URL_INPUT: ${{ inputs.icon_url }}
        run: |
          set -euo pipefail
          mkdir -p assets/icon
          curl -fL --retry 3 --retry-delay 2 "$ICON_URL_INPUT" -o assets/icon/icon.png
          flutter pub add --dev flutter_launcher_icons
          cat >> pubspec.yaml <<'YAML'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/icon/icon.png
          YAML
          flutter pub get
          dart run flutter_launcher_icons

      - name: Flutter pub get
        working-directory: webapp
        run: flutter pub get

      - name: Build Pegasus.app APK
        working-directory: webapp
        env:
          URL: ${{ inputs.web_url }}
          NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=WEB_URL="$URL" \
            --dart-define=APP_NAME="$NAME"

      - name: Kumpulkan APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH="$(find webapp/build/app/outputs/flutter-apk -type f -name '*.apk' | sort | head -n 1)"
          [ -n "$APK_PATH" ] || { echo "::error::APK tidak ditemukan."; exit 1; }
          mkdir -p apk_output
          SAFE_TAG="$(printf '%s' "$BUILD_TAG" | tr -c 'A-Za-z0-9._-' '_')"
          DEST="apk_output/pegasus.app-${SAFE_TAG}.apk"
          cp "$APK_PATH" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=pegasus-app-build-${SAFE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 1
          if-no-files-found: error
